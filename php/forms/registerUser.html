<section>
    <h2>Registrar usuario</h2>
    <form action="#" method="post" name="usuarioNuevo">
        <label>
            Profesión:
            <input type='text' name='profesion'/>
        </label>
        <label>
            Edad:
            <input type="number" name="edad" min="1" max="120" step="1" value="25">
        </label>
        <label>
            Género:
            <select name="genero">
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
            </select>
        </label>
        <label>
            Pericia informática:
            <input type="number" name="pericia" min="1" max="10" step="1" value="5">
        </label>
        <input type='submit' name="registrarUsuario" value='Registrar nuevo usuario'/>
    </form>            
</section>
