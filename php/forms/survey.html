<section>
    <h2>Cuestionario de usabilidad</h2>
    <form action="#" method="post" name="surveyForm">
        <h3>Pregunta 1</h3>
        <label>
            ¿Cuántas vueltas se dan al circuito Pertamina Mandalika?
            <input type="number" name="vueltas" min="1" max="200" step="1" value="1"/>
        </label>
        <h3>Pregunta 2</h3>
        <label>
            ¿En qué año nació el piloto Joan Mir?
            <input type="number" name="nacimiento" min="1950" max="2025" step="1" value="1975"/>
        </label>
        <h3>Pregunta 3</h3>
        <label>
            ¿En qué equipo de MotoGP está Joan Mir actualmente?
            <input type="text" name="equipo"/>
        </label>
        <h3>Pregunta 4</h3>
        <label>
            ¿En qué hemisferio se encuentra la ciudad de Baturiti?
            <select name="hemisferio">
                <option value="norte">Norte</option>
                <option value="sur">Sur</option>
            </select>           
        </label>
        <h3>Pregunta 5</h3>
        <label>
            ¿Qué piloto ganó la carrera de Indonesia?
            <input type="text" name="ganadorIndonesia"/>
        </label>
        <h3>Pregunta 6</h3>
        <label>
            ¿En qué año fue Joan Mir ganador de MotoGP?
            <input type="number" name="añoGanadorMir" min="2000" max="2026" step="1" value="2000"/>
        </label>
        <h3>Pregunta 7</h3>
        <label>
            A la hora de la carrera de Indonesia, ¿cuál fue la temperatura en grados centígrados en el circuito?
            <input type="number" name="temperaturaCircuito" min="0" max="50" step="0.1" value="20.0"/>
        </label>
        <h3>Pregunta 8</h3>
        <label>
            ¿Cuántas cartas hay en total en el juego de hacer parejas?
            <input type="number" name="numeroCartas" min="0" max="50" step="1" value="0"/>
        </label>
        <h3>Pregunta 9</h3>
        <label>
            Al terminar la carrera de Indonesia, ¿qué piloto lideraba la clasificación global?
            <input type="text" name="liderClasificacion"/>
        </label>
        <h3>Pregunta 10</h3>
        <label>
            ¿Cuántas victorias logró Joan Mir en la temporada 2024?
            <input type="number" name="victorias" min="0" max="100" step="1" value="0"/>
        </label>        
        <input type='submit' name="endSurvey" value='Terminar prueba'/>
    </form>
</section>
