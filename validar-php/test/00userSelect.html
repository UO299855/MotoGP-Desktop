<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <title>Test de usabilidad</title>

    <meta name="author" content="Javier Ortín Rodenas">
    <meta name="description" content="Pruebas de usabilidad del proyecto">
    <meta name="keywords" content="test,control,pruebas,usabilidad">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../estilo/estilo.css">
    <link rel="stylesheet" type="text/css" href="../estilo/layout.css">
</head>
<body>
    <h1>Pruebas de usabilidad</h1>
    <main>
        <section>
    <h2>Registrar usuario nuevo</h2>
    <form action="#" method="post" name="usuarioNuevo">
        <label for="dispositivo">
            Dispositivo de la prueba
        </label>
        <select name="dispositivo" id="dispositivo">
            <option value="ordenador">Ordenador</option>
            <option value="telefono">Teléfono</option>
            <option value="tablet">Tablet</option>
        </select>
        <label for="profesion">
            Profesión:
        </label>
        <input type="text" name="profesion" id="profesion">
        <label for="edad">
            Edad:
        </label>
        <input type="number" name="edad" min="1" max="120" step="1" value="25" id="edad">
        <label for="genero">
            Género:
        </label>
        <select name="genero" id="genero">
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select>
        <label for="pericia">
            Pericia informática (a rellenar por el facilitador):
        </label>
            <input type="number" id="pericia" name="pericia" min="1" max="10" step="1" value="5">
        <input type="submit" name="registrarUsuario" value="Registrar nuevo usuario">
    </form>            
</section><section><h2>Seleccionar un usuario ya existente</h2><p>No hay usuarios existentes que puedan realizar más pruebas.</p></section>    </main>

</body></html>
