<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <title>Test de usabilidad</title>

    <meta name="author" content="Javier Ortín Rodenas">
    <meta name="description" content="Pruebas de usabilidad del proyecto">
    <meta name="keywords" content="test,control,pruebas,usabilidad">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../estilo/estilo.css">
    <link rel="stylesheet" type="text/css" href="../estilo/layout.css">
</head>
<body>
    <h1>Pruebas de usabilidad</h1>
    <main>
        <section>

    <h2>Respuestas registradas con éxito</h2>
    <p>Hemos anotado sus respuestas para el test, puede ayudarnos dando su opinión si lo desea. Muchas gracias.</p>
    <form action="#" method="post" name="feedback">
        <label for="comentarios">Comentarios sobre problemas encontrados:</label>
        <textarea name="comentarios" id="comentarios"></textarea>
        <label for="propuestas">Propuestas de mejora:</label>
        <textarea name="propuestas" id="propuestas"></textarea>
        <label for="valoracion">Valore la web del 1 al 10</label>
        <input type="number" name="valoracion" id="valoracion" min="1" max="10" step="1" value="1">
        <input type="submit" name="sendFeedback" value="Terminar encuesta">
    </form>
</section>    </main>

</body></html>
